run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - ineffassign
    - misspell
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - typecheck
    - revive

linters-settings:
  goimports:
    local-prefixes: github.com/takutakahashi/acp-posts
