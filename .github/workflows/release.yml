name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binaries
        run: |
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -o acp-posts-linux-amd64 .
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -o acp-posts-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -o acp-posts-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -o acp-posts-darwin-arm64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o acp-posts-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            acp-posts-linux-amd64
            acp-posts-linux-arm64
            acp-posts-darwin-amd64
            acp-posts-darwin-arm64
            acp-posts-windows-amd64.exe

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/takutakahashi/acp-posts
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
